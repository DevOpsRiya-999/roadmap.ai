name: Test Self Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show system information
        run: |
          echo "Running on self-hosted runner"
          hostname
          whoami
          docker --version
          uname -a
